name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      released_version: ${{ steps.check.outputs.released_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare current version with published release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          current=$(node -p "require('./package.json').version")
          tauri_ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_ver=$(grep -E '^version = ' src-tauri/Cargo.toml | head -n1 | sed -E 's/version = "(.*)"/\1/')
          echo "version=${current}" >> "$GITHUB_OUTPUT"
          echo "Versions — package.json: ${current}, tauri.conf.json: ${tauri_ver}, Cargo.toml: ${cargo_ver}"

          if [ "${current}" != "${tauri_ver}" ] || [ "${current}" != "${cargo_ver}" ]; then
            echo "::error::Версии не совпадают: package.json=${current}, tauri.conf.json=${tauri_ver}, Cargo.toml=${cargo_ver}. Подними версию во всех трёх файлах."
            exit 1
          fi

          # Manual runs / tags always build — the user explicitly asked for it.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [[ "${REF}" == refs/tags/* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Ручной запуск / тег — собираем без проверки версии."
            exit 0
          fi

          # Released version comes from latest.json on the "latest" release of this repo.
          released=""
          if curl -fsSL -o /tmp/latest.json \
              "https://github.com/${REPO}/releases/download/latest/latest.json"; then
            released=$(jq -r '.version // empty' /tmp/latest.json 2>/dev/null || true)
          fi
          echo "released_version=${released}" >> "$GITHUB_OUTPUT"
          echo "Released version: ${released:-<none>}"

          if [ -z "${released}" ]; then
            echo "Нет latest.json — собираем как первый раз."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${current}" = "${released}" ]; then
            echo "::warning::Версия ${current} уже опубликована в latest. Сборка пропущена — забыли поднять версию в package.json / tauri.conf.json / Cargo.toml."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n%s\n' "${current}" "${released}" | sort -V -C; then
            echo "::warning::Текущая версия ${current} ниже опубликованной ${released}. Сборка пропущена."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Версия повышена: ${released} → ${current}. Собираем релиз."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            patchelf \
            file

      - name: Install npm deps
        run: npm ci

      - name: Build app
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          cp -R "${bundle}/dmg/"*.dmg out/ 2>/dev/null || true
          find "${bundle}" -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.sig' \) -exec cp {} out/ \; 2>/dev/null || true

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          Copy-Item "$bundle/nsis/*-setup.exe" out/ -ErrorAction SilentlyContinue
          Copy-Item "$bundle/nsis/*.sig" out/ -ErrorAction SilentlyContinue

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          cp "${bundle}/deb/"*.deb out/ 2>/dev/null || true
          cp "${bundle}/appimage/"*.AppImage out/ 2>/dev/null || true
          find "${bundle}/appimage" -type f \( -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' -o -name '*.sig' \) -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-manager-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [preflight, build]
    if: needs.preflight.outputs.should_release == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json
        id: latest_json
        env:
          UPDATE_NOTES: Automatically updated from ${{ github.repository }}@${{ github.sha }}.
        run: |
          chmod +x scripts/generate-latest-json.sh
          if ./scripts/generate-latest-json.sh artifacts artifacts/latest.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No signed updater bundles in artifacts; latest.json skipped." >&2
            ls -laR artifacts || true
          fi

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          notes="Built from ${REPO}@${SOURCE_SHA}. Download: https://github.com/${REPO}/releases/latest"

          if gh release view latest --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit latest \
              --repo "${REPO}" \
              --title "Latest build" \
              --notes "${notes}" \
              --latest
          else
            gh release create latest \
              --repo "${REPO}" \
              --title "Latest build" \
              --notes "${notes}" \
              --latest \
              --target main
          fi

          gh release view latest --repo "${REPO}" --json assets --jq '.assets[].name' | while read -r asset; do
            [ -z "$asset" ] && continue
            gh release delete-asset latest "$asset" --repo "${REPO}" -y
          done

          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release upload latest "${files[@]}" --repo "${REPO}" --clobber

          if [ "${{ steps.latest_json.outputs.ready }}" != "true" ]; then
            echo "Release published without latest.json — in-app updates will not work until the next signed build." >&2
            exit 1
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          UPDATE_NOTES: Built from ${{ github.repository }}@${{ github.sha }}.
        run: |
          set -euo pipefail

          chmod +x scripts/generate-latest-json.sh
          RELEASE_BASE="https://github.com/${REPO}/releases/download/${TAG}" \
            ./scripts/generate-latest-json.sh artifacts "artifacts/latest-${TAG}.json" || true

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --repo "${REPO}" -y --cleanup-tag
          fi

          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "${TAG}" \
            --notes "Built from ${REPO}@${SOURCE_SHA}." \
            --target main \
            "${files[@]}"
